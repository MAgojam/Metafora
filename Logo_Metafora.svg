<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%">
  <defs>
    <!-- Ombre morbide -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#001a4d" flood-opacity="0.12" />
    </filter>
    <filter id="slider-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.25" />
    </filter>

    <!-- Sfumature per dare volume alle icone -->
    <linearGradient id="book-cover" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0072CE" />
      <stop offset="100%" stop-color="#00467F" />
    </linearGradient>
    <linearGradient id="book-page" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <radialGradient id="bulb-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD54F" stop-opacity="0.75" />
      <stop offset="60%" stop-color="#FF9800" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#F58220" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bulb-base" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D35400" />
      <stop offset="50%" stop-color="#E67E22" />
      <stop offset="100%" stop-color="#A04000" />
    </linearGradient>

    <!-- Gradi per i flussi dati arcati -->
    <linearGradient id="stream-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0082D1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0082D1" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="stream-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9800" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FF9800" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <!-- Sfondo dark di presentazione -->
  <rect width="1000" height="560" fill="#181a20" />

  <!-- Card Bianca principale pulita -->
  <rect x="70" y="50" width="860" height="460" rx="32" ry="32" fill="#FFFFFF" filter="url(#soft-shadow)" />

  <!-- Pentagrammi (5 linee, 4 spazi) -->
  <g stroke="#2a4b7c" stroke-width="1.5" stroke-linecap="round" opacity="0.4">
    <!-- Pentagramma Sinistro -->
    <line x1="140" y1="230" x2="420" y2="230" /> <!-- Fa -->
    <line x1="140" y1="242" x2="420" y2="242" /> <!-- Re -->
    <line x1="140" y1="254" x2="420" y2="254" /> <!-- Si -->
    <line x1="140" y1="266" x2="420" y2="266" /> <!-- Sol -->
    <line x1="140" y1="278" x2="420" y2="278" /> <!-- Mi -->
    
    <!-- Pentagramma Destro -->
    <line x1="580" y1="230" x2="860" y2="230" />
    <line x1="580" y1="242" x2="860" y2="242" />
    <line x1="580" y1="254" x2="860" y2="254" />
    <line x1="580" y1="266" x2="860" y2="266" />
    <line x1="580" y1="278" x2="860" y2="278" />
  </g>

  <!-- NOTE MUSICALI (Crome: SOL - LA - RE = "SoLaRe") -->
  <g fill="#005C9E" stroke="#005C9E">
    <!-- SOL (Sulla 2° riga dal basso, y: 266) -->
    <g transform="translate(160, 266)">
      <ellipse cx="0" cy="0" rx="6.5" ry="4.5" transform="rotate(-20)" stroke="none" />
      <line x1="5.5" y1="-2" x2="5.5" y2="-35" stroke-width="2" />
      <path d="M 5.5,-35 C 16,-35 20,-20 15,-10 C 15,-15 11,-22 5.5,-25 Z" stroke="none" />
    </g>
    
    <!-- LA (Nel 2° spazio dal basso, y: 260) -->
    <g transform="translate(205, 260)">
      <ellipse cx="0" cy="0" rx="6.5" ry="4.5" transform="rotate(-20)" stroke="none" />
      <line x1="5.5" y1="-2" x2="5.5" y2="-35" stroke-width="2" />
      <path d="M 5.5,-35 C 16,-35 20,-20 15,-10 C 15,-15 11,-22 5.5,-25 Z" stroke="none" />
    </g>
    
    <!-- RE (Sulla 4° riga dal basso, stelo in basso, y: 242) -->
    <g transform="translate(250, 242)">
      <ellipse cx="0" cy="0" rx="6.5" ry="4.5" transform="rotate(-20)" stroke="none" />
      <!-- Per le note alte, lo stelo scende dal lato sinistro -->
      <line x1="-5.5" y1="2" x2="-5.5" y2="35" stroke-width="2" />
      <path d="M -5.5,35 C 5,35 9,20 4,10 C 4,15 0,22 -5.5,25 Z" stroke="none" />
    </g>
  </g>

  <!-- Flussi Dati Arcati -->
  <path d="M 320 205 Q 400 130 480 142" fill="none" stroke="url(#stream-blue)" stroke-width="8" stroke-dasharray="4 4" stroke-linecap="round" />
  <path d="M 680 205 Q 600 130 520 142" fill="none" stroke="url(#stream-orange)" stroke-width="8" stroke-dasharray="4 4" stroke-linecap="round" />

  <!-- STELLA A 8 PUNTE -->
  <g transform="translate(500, 142)">
    <polygon points="0,-42 -5,-12 0,0" fill="#0082D1" />
    <polygon points="-5,-12 -22,-22 0,0" fill="#005C9E" />
    <polygon points="-22,-22 -12,-5 0,0" fill="#0072CE" />
    <polygon points="-12,-5 -42,0 0,0" fill="#005C9E" />
    <polygon points="-42,0 -12,5 0,0" fill="#0082D1" />
    <polygon points="-12,5 -22,22 0,0" fill="#005C9E" />
    <polygon points="-22,22 -5,12 0,0" fill="#0072CE" />
    <polygon points="-5,12 0,42 0,0" fill="#005C9E" />
    <polygon points="0,-42 5,-12 0,0" fill="#FF9800" />
    <polygon points="5,-12 22,-22 0,0" fill="#F58220" />
    <polygon points="22,-22 12,-5 0,0" fill="#FF9800" />
    <polygon points="12,-5 42,0 0,0" fill="#F58220" />
    <polygon points="42,0 12,5 0,0" fill="#FF9800" />
    <polygon points="12,5 22,22 0,0" fill="#F58220" />
    <polygon points="22,22 5,12 0,0" fill="#FF9800" />
    <polygon points="5,12 0,42 0,0" fill="#F58220" />
    <path d="M 0,-42 L 5,-12 L 22,-22 L 12,-5 L 42,0 L 12,5 L 22,22 L 5,12 L 0,42 L -5,12 L -22,22 L -12,5 L -42,0 L -12,-5 L -22,-22 L -5,-12 Z" fill="none" stroke="#FFFFFF" stroke-width="1.2" />
  </g>

  <!-- CERCHIO SINISTRO: LIBRO AD ALTA QUALITÀ -->
  <g transform="translate(320, 255)" filter="url(#soft-shadow)">
    <circle cx="0" cy="0" r="52" fill="#FFFFFF" />
    <!-- Copertina (Volume posteriore) -->
    <path d="M -26,-12 C -15,-18 -3,-18 0,-14 C 3,-18 15,-18 26,-12 L 26,17 C 15,11 3,11 0,15 C -3,11 -15,11 -26,17 Z" fill="url(#book-cover)" />
    <!-- Pagine Interne -->
    <path d="M -24,-11 C -14,-16 -3,-16 0,-13 C 3,-16 14,-16 24,-11 L 24,14 C 14,9 3,9 0,13 C -3,9 -14,9 -24,14 Z" fill="url(#book-page)" stroke="#0072CE" stroke-width="1.5" stroke-linejoin="round" />
    <!-- Linea della rilegatura -->
    <line x1="0" y1="-13" x2="0" y2="13" stroke="#00467F" stroke-width="2.5" stroke-linecap="round" />
    <!-- Dettagli pagine curve (per dare senso di spessore) -->
    <path d="M -24,-5 C -14,-10 -3,-10 0,-7 M -24,1 C -14,-4 -3,-4 0,-1" fill="none" stroke="#CBD5E1" stroke-width="1" />
    <path d="M 24,-5 C 14,-10 3,-10 0,-7 M 24,1 C 14,-4 3,-4 0,-1" fill="none" stroke="#CBD5E1" stroke-width="1" />
    
    <!-- Icona Atomo -->
    <g transform="translate(-12, 1) scale(0.65)">
      <ellipse cx="0" cy="0" rx="8" ry="3" fill="none" stroke="#005C9E" stroke-width="2.5" transform="rotate(30)" />
      <ellipse cx="0" cy="0" rx="8" ry="3" fill="none" stroke="#005C9E" stroke-width="2.5" transform="rotate(-30)" />
      <ellipse cx="0" cy="0" rx="8" ry="3" fill="none" stroke="#005C9E" stroke-width="2.5" transform="rotate(90)" />
      <circle cx="0" cy="0" r="2.5" fill="#0082D1" />
    </g>
    
    <!-- Icona Ingranaggio -->
    <g transform="translate(12, 1) scale(0.65)">
      <path d="M 7,-2 L 9,-2 L 9,2 L 7,2 L 6,5 L 8,7 L 5,9 L 3,7 L 2,9 L 2,11 L -2,11 L -2,9 L -5,8 L -7,10 L -9,7 L -7,5 L -9,2 L -9,-2 L -7,-2 L -6,-5 L -8,-7 L -5,-9 L -3,-7 L -2,-9 L -2,-11 L 2,-11 L 2,-9 L 5,-8 L 7,-10 L 9,-7 L 7,-5 Z" fill="#005C9E" />
      <circle cx="0" cy="0" r="3.5" fill="#FFFFFF" />
    </g>
  </g>

  <!-- CERCHIO DESTRO: LAMPADINA AD ALTA QUALITÀ -->
  <g transform="translate(680, 255)" filter="url(#soft-shadow)">
    <circle cx="0" cy="0" r="52" fill="#FFFFFF" />
    
    <!-- Bagliore interno della lampadina -->
    <circle cx="0" cy="-6" r="18" fill="url(#bulb-glow)" />
    
    <!-- Contorno Lampadina in Vetro -->
    <path d="M 0,-24 C -13,-24 -19,-13 -14,-3 C -11,3 -7,7 -7,12 L 7,12 C 7,7 11,3 14,-3 C 19,-13 13,-24 0,-24 Z" fill="none" stroke="#F58220" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Riflesso del vetro -->
    <path d="M -13,-14 C -15,-6 -9,0 -6,4 C -11,0 -12,-8 -9,-15 C -10,-15 -12,-15 -13,-14 Z" fill="#FFB74D" opacity="0.6" />
    
    <!-- Rete Neurale Interna -->
    <g stroke="#D35400" stroke-width="2" stroke-linecap="round">
      <path d="M -6,-10 L -2,-4 L 4,-8 L 7,-2" fill="none" />
      <path d="M -2,-4 L 2,1 L 7,-2" fill="none" />
      <path d="M -2,-4 L -4,3" fill="none" />
    </g>
    <circle cx="-6" cy="-10" r="2" fill="#D35400" />
    <circle cx="-2" cy="-4" r="2.5" fill="#F58220" />
    <circle cx="4" cy="-8" r="2" fill="#D35400" />
    <circle cx="7" cy="-2" r="2" fill="#D35400" />
    <circle cx="2" cy="1" r="2" fill="#D35400" />
    <circle cx="-4" cy="3" r="2" fill="#D35400" />

    <!-- Base della lampadina a strati 3D -->
    <rect x="-8" y="13" width="16" height="3" rx="1.5" fill="url(#bulb-base)" />
    <rect x="-7" y="17" width="14" height="3" rx="1.5" fill="url(#bulb-base)" />
    <path d="M -4,21 L 4,21 L 2,24 L -2,24 Z" fill="#A04000" />
  </g>

  <!-- Testo "Mz" Moderno -->
  <g transform="translate(500, 292)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="64" fill="#005C9E" letter-spacing="-1">Mz</text>
  </g>

  <!-- Righello Inferiore Avanzato -->
  <g transform="translate(0, 420)">
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#2a4b7c" text-anchor="middle">
      <text x="140" y="45">0</text><text x="320" y="45">25</text>
      <text x="500" y="45">50</text><text x="680" y="45">75</text>
      <text x="860" y="45">100</text>
    </g>
    <g stroke="#2a4b7c" stroke-linecap="round">
      <line x1="140" y1="0" x2="860" y2="0" stroke-width="3.5" />
      <line x1="140" y1="-80" x2="140" y2="12" stroke-width="2.5" />
      <line x1="860" y1="-80" x2="860" y2="12" stroke-width="2.5" />
      <g stroke-width="2.5">
        <line x1="320" y1="-45" x2="320" y2="12" />
        <line x1="500" y1="-45" x2="500" y2="12" />
        <line x1="680" y1="-45" x2="680" y2="12" />
      </g>
      <g stroke-width="1.8">
        <line x1="230" y1="-30" x2="230" y2="0" /><line x1="410" y1="-30" x2="410" y2="0" />
        <line x1="590" y1="-30" x2="590" y2="0" /><line x1="770" y1="-30" x2="770" y2="0" />
      </g>
      <g stroke-width="1.2" opacity="0.75">
        <line x1="176" y1="-18" x2="176" y2="0" /><line x1="203" y1="-18" x2="203" y2="0" />
        <line x1="266" y1="-18" x2="266" y2="0" /><line x1="293" y1="-18" x2="293" y2="0" />
        <line x1="356" y1="-18" x2="356" y2="0" /><line x1="383" y1="-18" x2="383" y2="0" />
        <line x1="446" y1="-18" x2="446" y2="0" /><line x1="473" y1="-18" x2="473" y2="0" />
        <line x1="527" y1="-18" x2="527" y2="0" /><line x1="554" y1="-18" x2="554" y2="0" />
        <line x1="617" y1="-18" x2="617" y2="0" /><line x1="644" y1="-18" x2="644" y2="0" />
        <line x1="707" y1="-18" x2="707" y2="0" /><line x1="734" y1="-18" x2="734" y2="0" />
        <line x1="797" y1="-18" x2="797" y2="0" /><line x1="824" y1="-18" x2="824" y2="0" />
      </g>
    </g>

    <!-- Slider Cursore Digitale -->
    <g transform="translate(500, 0)" filter="url(#slider-shadow)">
      <rect x="-35" y="-14" width="70" height="28" rx="6" fill="#2A3B50" stroke="#FFFFFF" stroke-width="2" />
      <text x="0" y="4" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-weight="700" font-size="13" fill="#00E5FF">50%</text>
    </g>
  </g>
</svg>
