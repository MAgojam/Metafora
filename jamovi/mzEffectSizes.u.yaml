# mzEffectSizes.u.yaml
name: mzEffectSizes
title: Generic Effect Sizes
jus: '3.0'
stage: 0
compilerMode: tame
events:
  loaded: ./main::loaded
  update: ./main::update
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Study Label
        children:
          - type: VariablesListBox
            name: slab
            maxItemCount: 1
            isTarget: true
            ghostText: required
      - type: TargetLayoutBox
        label: Effect Size
        children:
          - type: VariablesListBox
            name: yi
            maxItemCount: 1
            isTarget: true
            ghostText: required
      - type: TargetLayoutBox
        label: Sampling Variance or SE
        children:
          - type: VariablesListBox
            name: vi
            maxItemCount: 1
            isTarget: true
            ghostText: required (select Variance or SE)

      - type: TargetLayoutBox
        label: Lower Limit
        children:
          - type: VariablesListBox
            name: ciLower
            maxItemCount: 1
            isTarget: true
            ghostText: required (lower CI limit)
      - type: TargetLayoutBox
        label: Upper Limit
        children:
          - type: VariablesListBox
            name: ciUpper
            maxItemCount: 1
            isTarget: true
            ghostText: required (upper CI limit)
      - type: LayoutBox
        children:
          - type: TextBox
            name: inputCiLevel
            format: number
            width: small
            suffix: "%"

      - type: TargetLayoutBox
        label: Subgroup Analysis
        children:
          - type: VariablesListBox
            name: subgroup
            maxItemCount: 1
            isTarget: true
            ghostText: optional
            events:
              change: ./main::onChange_subgroup

      - type: TargetLayoutBox
        label: Moderators
        children:
          - type: VariablesListBox
            name: moderator
            isTarget: true
            ghostText: |-
              optional
              Covariates: Continuous
              Factors: Nominal/Ordinal
            events:
              change: ./main::onChange_moderator

      - type: TargetLayoutBox
        label: Risk of Bias Domains
        children:
          - type: VariablesListBox
            name: robDomains
            maxItemCount: 6
            isTarget: true
            ghostText: |-
              optional
              Bias domains and overall rating
            events:
              change: ./main::onChange_robDomains

  - type: LayoutBox
    margin: large
    stretchFactor: 1
    children:
      - type: CustomControl
        name: tabbedControl
        stretchFactor: 1
        events:
          creating: ./main::tabbedControl_creating
