# mzProportions.u.yaml
name: mzProportions
title: Proportion Models
jus: '3.0'
stage: 0
compilerMode: tame
events:
  loaded: ./main::loaded
  update: ./main::update
children:
  - type: VariableSupplier
    persistentItems: false
    stretchFactor: 1
    children:
      - type: TargetLayoutBox
        label: Study Label
        children:
          - type: VariablesListBox
            name: slab
            maxItemCount: 1
            isTarget: true
            ghostText: required
      - type: TargetLayoutBox
        label: Frequencies of the Event
        children:
          - type: VariablesListBox
            name: xi
            maxItemCount: 1
            isTarget: true
            ghostText: required
      - type: TargetLayoutBox
        label: Total Sample Sizes
        children:
          - type: VariablesListBox
            name: ni
            maxItemCount: 1
            isTarget: true
            ghostText: required

      - type: TargetLayoutBox
        label: Subgroup Analysis
        children:
          - type: VariablesListBox
            name: subgroup
            maxItemCount: 1
            isTarget: true
            ghostText: optional
            events:
              change: ./main::onChange_subgroup

      - type: TargetLayoutBox
        label: Moderators
        children:
          - type: VariablesListBox
            name: moderator
            isTarget: true
            ghostText: |-
              optional
              Covariates: Continuous
              Factors: Nominal/Ordinal
            events:
              change: ./main::onChange_moderator

  - type: LayoutBox
    margin: large
    stretchFactor: 1
    children:
      - type: CustomControl
        name: tabbedControl
        stretchFactor: 1
        events:
          creating: ./main::tabbedControl_creating
